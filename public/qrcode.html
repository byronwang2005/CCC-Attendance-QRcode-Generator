<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UNNC中国文化课签到二维码生成器 - 生成签到二维码" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="theme-color" content="#0f2437" />
  <title>步骤 3 | UNNC中国文化课签到二维码生成器</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="modulepreload" href="scripts/wizard.js" />
  <link rel="modulepreload" href="scripts/receipt-stage.js" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <h1>
        <img src="ccc-small.webp" alt="CCC Logo" class="logo" loading="eager" fetchpriority="high" width="200" height="150" />
        <span class="site-title-text">UNNC中国文化课签到二维码生成器</span>
      </h1>
    </header>

    <main class="wizard-layout">
      <section class="stepper" aria-label="步骤进度">
        <article class="step-card is-done" data-step="1">
          <span class="step-number">1</span>
          <div>
            <strong>身份与链接</strong>
            <small>已完成</small>
          </div>
        </article>
        <article class="step-card is-done" data-step="2">
          <span class="step-number">2</span>
          <div>
            <strong>时间模式</strong>
            <small>已完成</small>
          </div>
        </article>
        <article class="step-card is-active" aria-current="step" data-step="3">
          <span class="step-number">3</span>
          <div>
            <strong>二维码</strong>
            <small>查看结果</small>
          </div>
        </article>
      </section>

      <section class="panel panel-slim" hidden aria-hidden="true">
        <div class="summary-grid summary-grid-wide">
          <article class="summary-card">
            <span>当前身份</span>
            <strong id="summaryIdentity"></strong>
          </article>
          <article class="summary-card">
            <span>时间模式</span>
            <strong id="summaryMode"></strong>
          </article>
          <article class="summary-card">
            <span>课程链接</span>
            <strong id="summaryUrl" class="summary-break"></strong>
          </article>
        </div>
      </section>

      <div id="qrcode" class="qrcode-stage" aria-label="生成的二维码热敏小票">
        <div class="qrcode-placeholder">
          <div>二维码将在这里生成</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="backBtn" class="button-secondary">返回上一步</button>
        <button type="button" id="restartBtn" class="button-secondary">重新开始</button>
      </div>
    </main>

    <footer class="site-footer">
      <p>
        Licensed under <a href="LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a> |
        Opensourced in <a href="https://github.com/byronwang2005/CCC-Attendance" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
      </p>
    </footer>

    <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  </div>

  <script type="module" src="scripts/background.js"></script>
  <script type="module" src="scripts/qrcode.js"></script>
</body>
</html>
